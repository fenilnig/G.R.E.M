; G.R.E.M. firmware - ESP32-S3 N16R8
; Build one stage:  pio run -e stage1 -t upload   (stage1..stage4)
; The finished firmware is the "grem" environment (same as stage4).

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    olikraus/U8g2@^2.35.19
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
    adafruit/Adafruit DRV2605 Library@^1.2.2
    h2zero/NimBLE-Arduino@1.4.3

[env:stage1]
build_src_filter = -<*> +<stage1_display_keys.cpp>

[env:stage2]
build_src_filter = -<*> +<stage2_dials.cpp>

[env:stage3]
build_src_filter = -<*> +<stage3_hid.cpp>

[env:stage4]
build_src_filter = -<*> +<stage4_full.cpp>

[env:stage5]
build_src_filter = -<*> +<stage5_buddy.cpp>

[env:grem]
build_src_filter = -<*> +<stage5_buddy.cpp>
